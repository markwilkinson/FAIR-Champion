name: Build and push staging image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cessda/fair-champion:staging
            ghcr.io/cessda/fair-champion:sha-${{ github.sha }}
            ghcr.io/cessda/fair-champion:${{ steps.version.outputs.version }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Built and pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/cessda/fair-champion:staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/cessda/fair-champion:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/cessda/fair-champion:${{ steps.version.outputs.version }}-dev" >> "$GITHUB_STEP_SUMMARY"
